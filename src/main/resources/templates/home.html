<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>ConnectSphere</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="layout"><section class="feed">
<div class="stories"><div class="story"><span>＋</span><small>Your story</small></div><div class="story" th:each="s:${stories}"><img th:src="${s.mediaUrl}"><small th:text="${s.author.username}"></small></div></div>
<div class="composer"><h3>Share something, <span th:text="${me.fullName != null ? me.fullName : me.username}"></span></h3><form action="/posts" method="post" enctype="multipart/form-data"><textarea name="caption" placeholder="What's happening in your world?"></textarea><div class="compose-row"><input type="file" name="media" accept="image/*,video/*"><button>Publish post</button></div></form><form action="/stories" method="post" enctype="multipart/form-data" class="story-form"><label>Add a 24-hour story <input type="file" name="media" accept="image/*,video/*" required></label><button class="secondary">Add story</button></form></div>
<article class="post" th:each="post:${posts}"><div class="post-head"><div class="avatar" th:text="${#strings.substring(post.author.username,0,1).toUpperCase()}"></div><a th:href="@{'/profile/'+${post.author.username}}" th:text="${post.author.username}"></a><small th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}"></small></div><p th:text="${post.caption}"></p><img class="post-media" th:if="${post.mediaUrl != null and post.mediaType == 'IMAGE'}" th:src="${post.mediaUrl}"><video class="post-media" th:if="${post.mediaUrl != null and post.mediaType == 'VIDEO'}" th:src="${post.mediaUrl}" controls></video><div class="post-actions">♡ <span>Connect with this post</span></div></article>
</section><aside><div class="side-card"><h3>Your space</h3><p th:text="${me.username}"></p><a th:href="@{'/profile/'+${me.username}}">View profile →</a></div><div class="side-card"><h3>Communities</h3><div th:each="c:${communities}"><b th:text="${c.name}"></b><p th:text="${c.description}"></p></div><form action="/communities" method="post"><input name="name" placeholder="Community name" required><input name="description" placeholder="Short description"><button class="secondary">Create group</button></form></div><div class="side-card"><h3>Make connections</h3><a href="/search">Find people →</a></div></aside></main></body></html>
