<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login | ConnectSphere</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth"><form class="auth-card" th:action="@{/login}" method="post"><h1>ConnectSphere</h1><p>Welcome back. Your people are here.</p><div th:if="${param.error}" class="error">Invalid username or password.</div><div th:if="${param.registered}" class="success">Account created. Please log in.</div><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button>Sign in</button><p>New here? <a href="/register">Create an account</a></p></form></body></html>
