<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Explore</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="narrow"><h1>Find your people</h1><form action="/search" method="get" class="searchbar"><input name="q" th:value="${q}" placeholder="Search by name or username"><button>Search</button></form><div class="user-result" th:each="u:${results}"><div class="avatar" th:text="${#strings.substring(u.username,0,1).toUpperCase()}"></div><div><b th:text="${u.fullName != null ? u.fullName : u.username}"></b><p>@<span th:text="${u.username}"></span></p></div><a th:href="@{'/profile/'+${u.username}}">View profile →</a></div></main></body></html>
