<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Profile</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="profile-wrap"><section class="profile-head"><div class="profile-avatar" th:text="${#strings.substring(profile.username,0,1).toUpperCase()}"></div><div><h1 th:text="${profile.fullName != null ? profile.fullName : profile.username}"></h1><p>@<span th:text="${profile.username}"></span></p><p th:text="${profile.bio}"></p><div class="stats"><span><b th:text="${posts.size()}"></b> posts</span><span><b th:text="${followers}"></b> followers</span><span><b th:text="${following}"></b> following</span></div><form th:if="${profile.id != me.id}" th:action="@{'/follow/'+${profile.id}}" method="post"><button th:text="${isFollowing ? 'Unfollow' : 'Follow'}"></button></form></div></section><h2>Posts</h2><div class="profile-grid"><div th:each="post:${posts}"><img th:if="${post.mediaUrl != null and post.mediaType == 'IMAGE'}" th:src="${post.mediaUrl}"><video th:if="${post.mediaUrl != null and post.mediaType == 'VIDEO'}" th:src="${post.mediaUrl}" controls></video><p th:text="${post.caption}"></p></div></div></main></body></html>
